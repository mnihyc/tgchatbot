name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  package:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.16'
          python-version: '3.13'
      - name: Package application release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen python .github/package_release.py --tag "$RELEASE_TAG"
      - name: Test packaged deployment with updater file permissions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen python .github/smoke_release.py "dist/tgchatbot-deploy-$RELEASE_TAG.tar.gz"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Checkout can replace an annotated tag with its peeled commit locally.
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" \
            "dist/tgchatbot-deploy-$RELEASE_TAG.tar.gz" \
            --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
