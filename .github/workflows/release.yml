name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  package:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.16'
          python-version: '3.13'
      - name: Package application release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen python .github/package_release.py --tag "$RELEASE_TAG"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/tgchatbot-deploy-$RELEASE_TAG.tar.gz" dist/update.sh dist/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" \
            --notes 'Download and extract the deployment bundle, then run ./update.sh.'
