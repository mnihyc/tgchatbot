name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: tgchatbot
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: tgchatbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tgchatbot -d tgchatbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --memory 2g
          --cpus 2
    env:
      TEST_DATABASE_URL: postgresql://tgchatbot:test-only@127.0.0.1:5432/tgchatbot
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.16'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked runtime dependencies
        run: uv sync --frozen --no-dev
      - name: Business workflows with real PostgreSQL and mocked Telegram/model APIs
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Check deployment shell syntax
        run: |
          bash -n deploy/update.sh
          sh -n deploy/entrypoint.sh
          bash -n deploy/smoke-image.sh

  retriever:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test Rust retriever with committed dependency lock
        run: cargo test --locked --manifest-path retriever/Cargo.toml
