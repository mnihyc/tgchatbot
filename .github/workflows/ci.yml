name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_call:
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: tgchatbot
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: tgchatbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tgchatbot -d tgchatbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --memory 2g
          --cpus 2
    env:
      TEST_DATABASE_URL: postgresql://tgchatbot:test-only@127.0.0.1:5432/tgchatbot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.16'
          python-version: '3.13'
          enable-cache: true
      - name: Install locked test dependencies
        run: uv sync --frozen
      - name: Business workflows with real PostgreSQL and mocked Telegram/model APIs
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Check deployment shell syntax
        run: |
          bash -n deploy/update.sh
          sh -n deploy/entrypoint.sh
          bash -n deploy/smoke-image.sh
