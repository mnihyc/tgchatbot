[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "tgchatbot"
version = "0.5.24"
description = "Persistent Telegram assistant with switchable model providers"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
  "python-dotenv>=1.0.1,<2",
  "httpx>=0.27.0,<1",
  "python-telegram-bot>=22.0,<23",
  "pillow>=10.4.0,<13",
  "av>=12.3.0,<18",
  "pydantic>=2.8.2,<3",
  "telegramify-markdown>=1.1.1,<2",
  "numpy>=2.4.3,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "ijson>=3.3,<4",
]

[project.scripts]
tgchatbot = "tgchatbot.app:main"

[tool.setuptools.packages.find]
include = ["tgchatbot*", "scripts*"]

[tool.setuptools.package-data]
"tgchatbot.storage" = ["*.sql"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pypdfium2>=5,<6",
]
